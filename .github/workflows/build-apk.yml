name: Build APK + single HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  single-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_single.py
      - uses: actions/upload-artifact@v4
        with:
          name: Stickman-Duel-Arena-html
          path: Stickman-Duel-Arena.html

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web dir
        run: |
          mkdir -p www
          cp index.html style.css www/
          cp -r js www/js

      - name: Install Capacitor
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Add Android platform
        run: npx cap add android

      - name: Landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"
          cat "$S"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Stickman-Duel-Arena.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stickman-Duel-Arena-apk
          path: Stickman-Duel-Arena.apk
