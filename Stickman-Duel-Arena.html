<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Stickman Duel Arena</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;color:#eef;font-family:system-ui,Segoe UI,Roboto,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;z-index:5;background:rgba(8,10,20,.62);overflow:hidden}
#ui.hidden{display:none}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;overflow:auto;touch-action:pan-y}
.title{font-size:clamp(34px,8vw,84px);line-height:.95;margin:0;text-align:center;letter-spacing:3px;text-shadow:0 4px 0 #000,0 0 30px #4af}
.title span{color:#ffd24a}
.sub{opacity:.85}
.menu{display:grid;grid-template-columns:repeat(2,minmax(150px,230px));gap:10px;margin-top:6px}
.menu.row{display:flex;flex-wrap:wrap;justify-content:center}
.menu .big{grid-column:1/-1}
.btn{background:linear-gradient(#34406a,#232c4d);color:#fff;border:2px solid #5d6fb8;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:hover{filter:brightness(1.25)}.btn:active{transform:scale(.97)}
.btn.big{font-size:20px;padding:14px 20px;background:linear-gradient(#e8453c,#a5241c);border-color:#ff8b80}
.btn.small{padding:6px 10px;font-size:13px}.btn.danger{background:#7a2020;border-color:#c55}
.panel{height:100%;display:flex;flex-direction:column;padding:10px 14px;gap:8px;max-width:1200px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hdr h2{margin:0;font-size:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#1c2340;color:#cdf;border:1px solid #4a5a9a;border-radius:8px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
.tab.on{background:#4a6ad8;color:#fff}
.scroll{flex:1;overflow:auto;touch-action:pan-y;padding-right:4px}
.two{flex:1;display:flex;gap:14px;min-height:0}
.two>.scroll,.two>div:first-child{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;align-content:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:#171d36;border:2px solid #38457c;border-radius:12px;padding:8px;text-align:center;cursor:pointer;position:relative;touch-action:manipulation}
.card:hover{border-color:#8aa0ff}.card.sel{border-color:#ffd24a;box-shadow:0 0 14px #ffd24a88}
.card.lock{opacity:.5}.card.dim{opacity:.4}.card.wide{text-align:left;padding:12px}
.card h3{margin:0 0 4px}.card p{margin:0;font-size:13px;opacity:.85}
.card canvas{display:block;margin:0 auto;max-width:100%}
.card .big{font-size:48px;height:150px;line-height:150px}
.card.wep .big{height:50px}
.cn{font-weight:700;font-size:14px;margin-top:2px}.cn .dot,.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1px solid #fff8}
.lk{color:#ffb;font-size:12px;position:absolute;top:6px;right:8px}
.card small{display:block;font-size:11px;opacity:.75}
.ap{height:46px;border-radius:6px;margin-bottom:6px;position:relative;overflow:hidden}.ap i{position:absolute;bottom:0;left:0;right:0;height:12px}
.detail{width:290px;flex:none;overflow:auto;text-align:center;touch-action:pan-y}
.detail h3{margin:2px 0}.muted{opacity:.7}.tiny{font-size:11px}
.stats{display:grid;grid-template-columns:90px 1fr;gap:3px 6px;text-align:left;font-size:12px;align-items:center}
.sbar{height:8px;background:#0006;border-radius:4px;overflow:hidden}.sbar i{display:block;height:100%}
.abl{text-align:left;font-size:12px;margin-top:8px}.ab{background:#0003;border-radius:6px;padding:4px 6px;margin-bottom:4px}.k{background:#334;border-radius:4px;padding:0 4px;font-size:11px}
.imp{display:inline-block;margin-top:6px;font-size:12px;border:1px dashed #66a;padding:4px 8px;border-radius:6px;cursor:pointer}.imp input{display:none}
.opts{display:flex;flex-wrap:wrap;gap:12px 20px;margin:10px 0;align-items:center}
.opts label{display:flex;gap:8px;align-items:center;font-size:14px}
select,input[type=text],input:not([type]){background:#1c2340;color:#fff;border:1px solid #4a5a9a;border-radius:6px;padding:5px}
input[type=range]{touch-action:pan-x;width:150px}
.keys{border-collapse:collapse;font-size:14px}.keys td,.keys th{padding:3px 10px;border-bottom:1px solid #fff2;text-align:left}
.keys .key{min-width:70px}
.ed select{max-width:150px}
.saved{display:flex;gap:8px;align-items:center;margin:4px 0}
.resbox{background:#121830f0;border:2px solid #5d6fb8;border-radius:16px;padding:20px 26px;text-align:center;max-width:640px;width:100%}
.resbox h1{margin:0 0 8px;font-size:44px}.win{color:#6f6}.lose{color:#f66}tr.win td{color:#8f8}
.unl{color:#ffd24a}.ach{padding:4px 0;opacity:.5}.ach.got{opacity:1}
.br{padding:4px;opacity:.6}.br.cur{opacity:1;color:#ffd24a;font-weight:700}.br.done{color:#7f7}
.pl{display:flex;gap:8px;justify-content:center}
#trainPanel{position:fixed;top:50px;right:8px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;max-width:60vw;justify-content:flex-end;touch-action:manipulation}
#trainPanel.hidden{display:none}
#trainPanel button,#trainPanel select{background:#1c2340cc;color:#fff;border:1px solid #6a7ac8;border-radius:6px;padding:4px 8px;font-size:12px}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toastItem{background:#000c;border:1px solid #ffd24a;padding:8px 14px;border-radius:8px;font-size:14px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
/* touch */
#touch{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
body.touchon.playing #touch{display:block}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:min(34vw,34vh,190px);height:min(34vw,34vh,190px);border-radius:50%;background:#ffffff18;border:2px solid #fff4;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21%;border-radius:50%;background:#ffffff66;border:2px solid #fff9}
.tbtns{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,min(15vw,15vh,80px));gap:8px;pointer-events:none}
.tb{pointer-events:auto;aspect-ratio:1;border-radius:50%;border:2px solid #fff6;background:#2a3a7a99;color:#fff;font-size:22px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.tb small{font-size:10px;opacity:.85;margin-top:2px}.tb.on{background:#e8453ccc}
.tb.pause{position:absolute;top:96px;left:50%;margin-left:-19px;width:38px;height:38px;font-size:13px;opacity:.7}
@media (max-width:700px){.two{flex-direction:column}.detail{width:100%;order:-1;max-height:42%}.menu{grid-template-columns:1fr 1fr}.panel{padding:6px}}

</style></head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="trainPanel" class="hidden"></div>
<div id="touch">
 <div id="joy"><div id="knob"></div></div>
 <button data-b="pause" class="tb pause">❚❚</button>
 <div class="tbtns">
  <button data-b="jump" class="tb">⤒<small>Прыжок</small></button>
  <button data-b="light" class="tb">👊<small>Удар</small></button>
  <button data-b="heavy" class="tb">💥<small>Сильн.</small></button>
  <button data-b="block" class="tb">🛡<small>Блок</small></button>
  <button data-b="ability" class="tb">✨<small>Спец</small></button>
  <button data-b="interact" class="tb">✋<small>Взять</small></button>
  <button data-b="throw" class="tb">🎯<small>Бросок</small></button>
 </div>
</div>
<div id="toast"></div>

class Arena{
 constructor(id,game,opts={}){this.def=DEF[id];this.id=id;this.game=game;this.W=W;this.H=H;this.killY=this.def.killY;this.gy=GY;this.friction=this.def.friction;this.pal=this.def.pal;
  this.solids=[];this.hazards=[];this.objs=[];this.pads=[];this.saws=[];this.spawns=[];this.fallers=false;this.fallT=5;this.fallTimer=3;this.time=0;this.destruct=opts.destruct!==false;
  this.def.build(this);
  this.solids.forEach(s=>{if(s.mover){s.bx=s.x;s.by=s.y}});
  if(!this.destruct)this.solids.forEach(s=>{if(s.destructible)s.destructible=false});
  this.seed=[];for(let i=0;i<60;i++)this.seed.push(Math.random());
  this.bgState=null;
 }
 crate(x,y,explosive,loot){const r=R(x,y,44,44,{type:explosive?'tnt':'crate',crate:true,hp:explosive?20:25,maxhp:25,explosive,loot:!!loot&&!explosive,vy:0,fric:1});this.solids.push(r);this.objs.push(r)}
 spawnPos(i,n){const xs=this.spawns;return {x:xs[i%xs.length],y:200}}
 randomDropX(){const c=this.solids.filter(s=>s.active&&!s.crate&&s.w>=120&&s.y<this.killY-100&&!s.vis===false);if(!c.length)return {x:W/2,y:-60};const s=U.pick(c);return {x:U.clamp(s.x+U.rand(20,s.w-20),30,W-30),y:-80}}
 // damage destructible rect / crate / crumble plank
 damageRect(Rc,dmg,hx,hy,owner){
  if(!Rc.active)return;
  if(Rc.crumble&&Rc.state===0){Rc.state=1;Rc.cT=0.55}
  if(!(Rc.destructible||Rc.crate))return;
  Rc.hp-=dmg;Rc.flash=0.12;const g=this.game;
  g.particles.debris(hx,hy,4,4,SD.Arena.col(this,Rc),4,150);
  if(Rc.hp<=0)this.breakRect(Rc,owner)
 }
 breakRect(Rc,owner){
  if(!Rc.active)return;Rc.active=false;const g=this.game;
  g.particles.debris(Rc.x,Rc.y,Rc.w,Rc.h,SD.Arena.col(this,Rc),Math.min(30,8+Rc.w*Rc.h/300|0),260);g.audio.play('break');
  if(Rc.explosive){g.combat.explosion(Rc.x+Rc.w/2,Rc.y+Rc.h/2,170,26,owner,'tnt')}
  else if(Rc.loot){g.items.spawn(Rc.x+Rc.w/2,Rc.y,null,{vy:-300})}
  if(Rc.type==='wall'||Rc.type==='dirtwall')g.shake(6);
 }
 nearestGround(x,y){const s=SD.Phys.supportAt(this,x,y-6,0);return s}
 update(dt){
  const g=this.game;this.time+=dt;
  // movers
  for(const s of this.solids){if(!s.active)continue;
   if(s.mover){const m=s.mover;m.ph+=dt*m.spd;const k=(Math.sin(m.ph)+1)/2;const nx=U.lerp(m.x0,m.x1,k),ny=U.lerp(m.y0,m.y1,k);s.vx=(nx-s.x)/dt;s.vy=(ny-s.y)/dt;s.x=nx;s.y=ny}
   if(s.flash>0)s.flash-=dt;
   if(s.crumble){if(s.state===1){s.cT-=dt;if(s.cT<=0){s.state=2;s.vy2=0}}else if(s.state===2){s.vy2+=1600*dt;s.y+=s.vy2*dt;if(s.y>1200)s.active=false;s.oneway=true;s.drop=1}
    else{for(const f of g.fighters)if(f.alive&&f.root.ground===s&&f.state!=='down'){s.cT+=dt;if(s.cT>0.9){s.state=1;s.cT=0.4}}}}
   if(s.crate){ // gravity for crates
    const sup=SD.Phys.supportAt(this,s.x+s.w/2,s.y+s.h,3);let rest=false;
    if(sup&&sup!==s&&sup.y<=s.y+s.h+1&&s.vy>=0&&s.y+s.h>=sup.y-1){s.y=sup.y-s.h;s.vy=0;rest=true}
    if(!rest){s.vy+=1800*dt;s.y+=s.vy*dt;for(const o of this.solids){if(o===s||!o.active||o.oneway&&s.vy<0)continue;if(s.x+s.w>o.x&&s.x<o.x+o.w&&s.y+s.h>o.y&&s.y+s.h-s.vy*dt<=o.y+6&&s.y<o.y){s.y=o.y-s.h;s.vy=0;break}}}
   }}
  // falling hazards
  if(this.fallers&&g.running){this.fallTimer-=dt;if(this.fallTimer<=0){this.fallTimer=this.fallT*U.rand(0.7,1.3);const tg=g.fighters.filter(f=>f.alive);const x=tg.length&&Math.random()<0.6?U.pick(tg).root.x+U.rand(-100,100):U.rand(120,W-120);
    this.objs.push({kind:'fall',x:U.clamp(x,60,W-60),y:-80,state:0,t:0.9,vy:0,type:this.fallKind,w:this.fallKind==='stalactite'?40:64,h:this.fallKind==='stalactite'?90:64})}}
  for(let i=this.objs.length-1;i>=0;i--){const o=this.objs[i];if(o.crate){if(!o.active)this.objs.splice(i,1);continue}
   if(o.kind==='fall'){
    if(o.state===0){o.t-=dt;o.y=-80;if(o.t<=0){o.state=1}}
    else if(o.state===1){o.vy=Math.min(1500,o.vy+2600*dt);const oy=o.y;o.y+=o.vy*dt;
     for(const f of g.fighters){if(!f.alive||f.invuln>0)continue;const p=f.P[1],q=f.P[2];for(const pt of [p,q,f.P[0]]){if(Math.abs(pt.x-o.x)<o.w/2+6&&pt.y>o.y-o.h/2&&pt.y<o.y+o.h/2+10){g.combat.hazardHit(f,{dmg:18,kx:Math.sign(pt.x-o.x||1)*300,ky:-250,src:'block'},pt.x,pt.y);o.state=2;o.t=0;break}}if(o.state===2)break}
     if(o.state===1){for(const s of this.solids){if(!s.active||s.oneway||s.crate&&false)continue;if(o.x>s.x&&o.x<s.x+s.w&&o.y+o.h/2>=s.y&&oy+o.h/2<=s.y+8){o.y=s.y-o.h/2;o.state=2;o.t=0;if(s.destructible||s.crate)this.damageRect(s,30,o.x,s.y,null);break}}}
     if(o.state===2){g.particles.debris(o.x-o.w/2,o.y,o.w,o.h/2,o.type==='block'?'#888':'#8a8090',10,260);g.audio.play('break');g.shake(5);g.particles.dust(o.x,o.y+o.h/2,6)}
     if(o.y>this.killY+100)this.objs.splice(i,1)}
    else if(o.state===2){this.objs.splice(i,1)}
   }}
  // saws
  for(const s of this.saws){s.x+=s.dir*s.spd*dt;if(s.x<s.x0||s.x>s.x1)s.dir*=-1;s.rot=(s.rot||0)+dt*14;
   for(const f of g.fighters){if(!f.alive||f.invuln>0)continue;for(const pt of [f.P[0],f.P[1],f.P[4],f.P[6],f.P[8],f.P[10]]){if(Math.hypot(pt.x-s.x,pt.y-s.y)<s.r+4){if(!(s.hit[f.id]>g.time)){s.hit[f.id]=g.time+0.6;g.combat.hazardHit(f,{dmg:9,kx:Math.sign(pt.x-s.x||1)*350,ky:-300,src:'saw'},pt.x,pt.y,true)}}}}}
  // hazards (lava / spikes)
  for(const hz of this.hazards){for(const f of g.fighters){if(!f.alive)continue;let inside=false,pt=f.P[0];
    for(const q of [f.P[0],f.P[8],f.P[10],f.P[1]]){if(q.x>hz.x&&q.x<hz.x+hz.w&&q.y>hz.y&&q.y<hz.y+hz.h){inside=true;pt=q;break}}
    if(!inside)continue;
    if(hz.type==='lava'){f.fx.burn=Math.max(f.fx.burn||0,2.5);if(!(f.lavaT>g.time)){f.lavaT=g.time+0.45;g.combat.hazardHit(f,{dmg:hz.dps*0.45,kx:U.rand(-200,200),ky:-950,src:'lava'},pt.x,pt.y,true);g.particles.sparks(pt.x,hz.y,14,'#ff8a22',380,0.7,4)}}
    else if(hz.type==='spikes'){if(!(f.spikeT>g.time)){f.spikeT=g.time+0.5;g.combat.hazardHit(f,{dmg:hz.dmg,kx:U.rand(-150,150),ky:-650,src:'spikes'},pt.x,pt.y,true)}}}}
  // jump pads
  for(const pd of this.pads){for(const f of g.fighters){if(!f.alive)continue;const r=f.root;if(f.w>0.15){const fy=r.y+f.footOff;if(r.x>pd.x&&r.x<pd.x+pd.w&&fy>pd.y-4&&fy<pd.y+30&&r.vy>=0){r.vy=-1350;r.ground=null;g.audio.play('jump',1.6);g.particles.ring(r.x,fy,40,'#00e5ff')}}else{const p=f.P[0];if(p.x>pd.x&&p.x<pd.x+pd.w&&p.y>pd.y-30&&p.y<pd.y+40){SD.Phys.impulse(p,0,-1400)}}}}
 }
};

const TC={stone:['#6f6a66','#9a948c'],concrete:['#5c6672','#8d99a8'],wall:['#807a74','#a8a29a'],grass:['#7a5230','#5aa63a'],dirtwall:['#7a5230','#946a40'],wood:['#8a6030','#a8783c'],crystal:['#4a3a70','#8a6ad0'],rock:['#3a3446','#5a5068'],ice:['#9fd4ea','#e8fbff'],basalt:['#3a2a28','#6a4a40'],cloudrock:['#8a8f9a','#7ad06a'],metal:['#1a1a30','#00e5ff'],plank:['#7a5a2a','#a07a3a'],obsidian:['#2a1a2a','#8a5a8a'],cracked:['#4a3a4a','#9a6a9a'],crate:['#9a7040','#c8a060'],tnt:['#b02a2a','#e04a3a']};
Arena.col=(a,R)=>(TC[R.type]||['#777','#aaa'])[0];

// ------------- drawing -------------
Arena.prototype.drawSolids=function(ctx,t){
 const q=this.game.quality;
 for(const R of this.solids){if(!R.active||R.vis===false)continue;const c=TC[R.type]||TC.stone;
  ctx.save();
  if(R.state===1)ctx.translate(U.rand(-1.5,1.5),0);
  if(R.type==='tnt'||R.type==='crate'){ctx.fillStyle=c[0];ctx.fillRect(R.x,R.y,R.w,R.h);ctx.strokeStyle=c[1];ctx.lineWidth=3;ctx.strokeRect(R.x+2,R.y+2,R.w-4,R.h-4);
   if(R.type==='tnt'){ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('TNT',R.x+R.w/2,R.y+R.h/2+6);ctx.fillStyle='#222';ctx.fillRect(R.x,R.y+R.h/2-12,R.w,3);ctx.fillRect(R.x,R.y+R.h/2+10,R.w,3)}
   else{ctx.beginPath();ctx.moveTo(R.x,R.y);ctx.lineTo(R.x+R.w,R.y+R.h);ctx.moveTo(R.x+R.w,R.y);ctx.lineTo(R.x,R.y+R.h);ctx.stroke()}}
  else if(R.oneway){ctx.fillStyle=c[1];ctx.fillRect(R.x,R.y,R.w,6);ctx.fillStyle=c[0];ctx.fillRect(R.x,R.y+6,R.w,R.h-6);
   if(this.id==='future'){ctx.fillStyle=c[1];ctx.globalAlpha=0.5;ctx.fillRect(R.x,R.y+R.h,R.w,3);ctx.globalAlpha=1}}
  else{ctx.fillStyle=c[0];ctx.fillRect(R.x,R.y,R.w,R.h);ctx.fillStyle=c[1];ctx.fillRect(R.x,R.y,R.w,Math.min(14,R.h));
   if(q!=='low'){ctx.strokeStyle=U.rgba('#000000',0.25);ctx.lineWidth=2;const step=R.type==='grass'||R.type==='dirtwall'?60:50;ctx.beginPath();for(let x=R.x;x<R.x+R.w;x+=step){ctx.moveTo(x,R.y+14);ctx.lineTo(x,Math.min(R.y+R.h,this.H+20))}for(let y=R.y+14+step;y<Math.min(R.y+R.h,this.H+20);y+=step){ctx.moveTo(R.x,y);ctx.lineTo(R.x+R.w,y)}ctx.stroke()}}
  if((R.destructible||R.crate)&&R.hp<R.maxhp){ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=2;const k=1-R.hp/R.maxhp;ctx.beginPath();const n=Math.ceil(k*5);for(let i=0;i<n;i++){const x=R.x+R.w*(0.15+0.7*((i*0.37)%1));ctx.moveTo(x,R.y);ctx.lineTo(x+8,R.y+Math.min(R.h,30));ctx.lineTo(x-4,R.y+Math.min(R.h,50))}ctx.stroke()}
  if(R.flash>0){ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(R.x,R.y,R.w,R.h)}
  ctx.restore()}
 for(const pd of this.pads){ctx.fillStyle='#00e5ff';ctx.fillRect(pd.x,pd.y,pd.w,pd.h);ctx.fillStyle='#fff';ctx.fillRect(pd.x+6,pd.y+3,pd.w-12,3)}
 for(const hz of this.hazards){if(hz.type==='lava'){const g=ctx.createLinearGradient(0,hz.y,0,hz.y+hz.h);g.addColorStop(0,'#ffb22a');g.addColorStop(0.2,'#ff4a12');g.addColorStop(1,'#7a0a00');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(hz.x-200,hz.y+hz.h);for(let x=hz.x-200;x<=hz.x+hz.w+200;x+=30)ctx.lineTo(x,hz.y+Math.sin(x*0.02+t*2)*6);ctx.lineTo(hz.x+hz.w+200,hz.y+hz.h);ctx.fill()}
  else if(hz.type==='spikes'){ctx.fillStyle='#ccd';for(let x=hz.x;x<hz.x+hz.w;x+=20){ctx.beginPath();ctx.moveTo(x,hz.y+hz.h);ctx.lineTo(x+10,hz.y);ctx.lineTo(x+20,hz.y+hz.h);ctx.fill()}}}
 for(const s of this.saws){ctx.strokeStyle='#444';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(s.x0,s.y);ctx.lineTo(s.x1,s.y);ctx.stroke();ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot||0);ctx.fillStyle='#ccd';ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*6.283,r=i%2?s.r*0.8:s.r;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.fill();ctx.fillStyle='#555';ctx.beginPath();ctx.arc(0,0,6,0,6.3);ctx.fill();ctx.restore()}
 for(const o of this.objs){if(o.kind!=='fall')continue;
  if(o.state===0){ctx.fillStyle='rgba(255,60,60,'+(0.3+0.3*Math.sin(t*30))+')';ctx.fillRect(o.x-o.w/2,0,o.w,this.gy+60);}
  else if(o.state===1){ctx.save();ctx.translate(o.x,o.y);if(o.type==='stalactite'){ctx.fillStyle='#8a8090';ctx.beginPath();ctx.moveTo(-o.w/2,-o.h/2);ctx.lineTo(o.w/2,-o.h/2);ctx.lineTo(0,o.h/2);ctx.fill()}else{ctx.fillStyle='#777';ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.strokeStyle='#333';ctx.lineWidth=4;ctx.strokeRect(-o.w/2+2,-o.h/2+2,o.w-4,o.h-4)}ctx.restore()}}

'use strict';
// BotAI: 4 levels. Produces the same input struct as a human.
(function(SD){

 {name:'Обычный',react:0.3,aggr:0.5,block:0.45,dodge:0.1,combo:2,ability:0.3,pickup:0.7,parry:0,hazard:0.85,wait:0.5},
 {name:'Опытный',react:0.17,aggr:0.7,block:0.65,dodge:0.35,combo:3,ability:0.6,pickup:0.9,parry:0.3,hazard:0.97,wait:0.3},
 {name:'Мастер',react:0.08,aggr:0.85,block:0.85,dodge:0.55,combo:4,ability:0.9,pickup:1,parry:0.65,hazard:1,wait:0.15}];

const mk=()=>({x:0,jump:false,jumpHeld:false,down:false,light:false,heavy:false,heavyHeld:false,lightHeld:false,block:false,ability:false,throw:false,interact:false});
class BotController{
 constructor(level){this.lv=LV[U.clamp(level,0,3)];this.level=level;this.t=0;this.thinkT=0;this.hold={};this.plan='approach';this.planT=0;this.cmd=mk();this.comboLeft=0;this.atkCd=0;this.strafe=1;this.strafeT=0;this.dodgeCd=0;this.seenAtk=null;this.jumpCd=0;this.wantItem=null;this.dummy=null;this.blockT=0;this.rollT=0;this.heavyHold=0}
 setLevel(l){this.level=l;this.lv=LV[U.clamp(l,0,3)]}
 // edge check: is there ground ahead?
 groundAhead(f,game,dx,dist=70){const x=f.P[0].x+dx*dist,A=game.arena;const s=P.supportAt(A,x,f.root.y+f.footOff-20,60);return s}

 weaponReach(f){const w=f.main;if(!w)return 78;const d=w.def;if(['bow','xbow','knives','blaster','magic'].includes(d.style)&&(w.ammo>0||d.regen))return 520;return d.len*(1-d.pivot)+52}
 poll(f,game,dt){

  const e=game.nearestEnemy(f,true);

  if(!e){c.x=0;c.block=false;return c}
  const dx=e.P[0].x-f.P[0].x,dy=e.P[0].y-f.P[0].y,adx=Math.abs(dx),sx=U.sign(dx);

  const eReach=e.main?(ranged?300:e.main.def.len+50):78;

  if(this.blockT>0){this.blockT-=dt;c.block=true;if(this.blockT<=0)c.block=false}

  if(this.thinkT<=0){
   this.thinkT=lv.react*U.rand(0.7,1.3);
   this.react(f,e,game,dx,adx,sx,reach,eReach);
  }
  // ---- movement ----
  let want=0;
  switch(this.plan){
   case 'approach':want=sx;if(adx<reach*0.8)want=0;if(ranged&&adx<260)want=-sx;break;
   case 'retreat':want=-sx;break;
   case 'strafe':want=this.strafe;break;
   case 'item':{const it=this.wantItem;if(it&&game.items.list.includes(it)){const ix=it.rigid.x-f.P[0].x;want=Math.abs(ix)>40?U.sign(ix):0;if(Math.abs(ix)<=70&&Math.abs(it.rigid.y-f.P[0].y)<120){c.interact=true;this.plan='approach';this.wantItem=null}else if(it.rigid.y<f.P[0].y-110&&this.jumpCd<=0&&f.grounded){c.jump=true;c.jumpHeld=true;this.jumpCd=0.8}}else this.plan='approach';break}
   case 'defend':want=0;break;
   case 'wait':want=adx>reach+60?sx*0.5:0;break;
  }

  // edges and hazards
  if(want!==0){
   const g=this.groundAhead(f,game,want,60);const hz=this.hazardAt(game,f.P[0].x+want*60,f.root.y+f.footOff+10);
   if(!g||hz){
    // gap: jump if landing exists beyond and we want to chase, else stop
    const far=this.groundAhead(f,game,want,230);
    if(far&&!hz&&f.grounded&&this.jumpCd<=0&&Math.random()<lv.hazard+0.05&&this.plan!=='retreat'){c.jump=true;c.jumpHeld=true;this.jumpCd=0.7}
    else if(Math.random()<lv.hazard)want=0}}

   if(dy<-110&&adx<260&&Math.random()<0.04+lv.aggr*0.04){c.jump=true;c.jumpHeld=true;this.jumpCd=0.9}
   const blocked=want!==0&&game.arena.solids.some(R=>R.active&&!R.oneway&&R.y<f.root.y+f.footOff-8&&R.y>f.root.y-80&&f.P[0].x+want*40>R.x&&f.P[0].x+want*40<R.x+R.w&&R.h>0&&R.y+R.h>f.root.y);

  for(const p of game.proj.list){if(p.team===f.team||p.stuck)continue;const tx=(f.P[1].x-p.x)/(p.vx||1e-3);if(tx>0&&tx<0.35&&Math.abs(p.y+p.vy*tx-f.P[1].y)<60&&this.dodgeCd<=0&&Math.random()<lv.block+0.2){if(Math.random()<0.5&&f.grounded&&this.jumpCd<=0){c.jump=true;c.jumpHeld=true;this.jumpCd=0.6}else{this.blockT=0.35}this.dodgeCd=0.5}}
  c.x=want;
  // ---- attacks ----

   const inRange=adx<reach&&Math.abs(dy)<(ranged?200:130);
   const wantAtk=inRange&&Math.random()<lv.aggr*(dt*60)*0.12+0.02;
   if(wantAtk&&this.plan!=='retreat'){
    if(ranged){ // keep distance; shoot
      c.light=true;this.atkCd=lv.wait*0.8+0.3;if(lv.combo>2&&Math.random()<0.25){c.heavy=true;this.heavyHold=0.35;c.heavyHeld=true;c.light=false}}
    else{
     const roll=Math.random();
     if(roll<0.25*lv.aggr&&lv.combo>=2&&f.stamina>25){c.heavy=true;this.heavyHold=lv.combo>=3?0.25:0;c.heavyHeld=this.heavyHold>0;this.atkCd=lv.wait+0.5}
     else{c.light=true;this.comboLeft=Math.min(lv.combo-1,Math.floor(Math.random()*lv.combo));this.atkCd=0.22;this.comboCd=true}}}
  }
  else if(f.state==='atk'&&this.comboLeft>0&&f.moveT>(f.move.cancel||f.move.dur*0.6)-0.03&&f.hitActive===false){c.light=true;this.comboLeft--;if(this.comboLeft===0&&lv.combo>=3&&Math.random()<0.5){c.light=false;c.heavy=true}}
  // ability
  if(f.state==='free'&&f.energy>=30&&Math.random()<lv.ability*0.02&&adx<650){const ab=f.def.ab;let slot=!f.grounded?'a':'n';if(f.grounded&&adx>200&&Math.random()<0.5)slot='f';if(f.energy>=100&&f.grounded&&Math.random()<0.7&&lv.combo>=2){slot='u'}
   c.ability=true;c.down=slot==='u';c.x=slot==='f'?sx:(slot==='n'?0:c.x)}
  // item pickup
  if(f.state==='free'&&game.cfg&&game.cfg.pickups!==false&&this.plan!=='item'&&(!f.main||game.time%7<0.03)&&Math.random()<lv.pickup*0.03){const it=game.items.nearest({P:[{x:f.P[0].x,y:f.P[0].y}]},520);if(it&&(!f.main||(it.def.slot==='off'&&!f.off))){if(Math.abs(it.rigid.y-f.P[0].y)<260){this.plan='item';this.wantItem=it;this.planT=3}}}
  if(this.plan==='item'){this.planT-=dt;if(this.planT<=0)this.plan='approach'}

  return c}

UI.trainPanel=function(game){const p=$('#trainPanel');if(game.cfg.mode!=='training'){p.classList.add('hidden');return}p.classList.remove('hidden');
 const wl=Object.values(SD.WEAPONS).map(w=>`<option value="${w.id}">${w.name}</option>`).join('');
 p.innerHTML=`<select id="tdm">${[['stand','Стоит'],['block','Блокирует'],['crouch','Присел'],['jump','Прыгает'],['walk','Ходит'],['attack','Атакует'],['bot','Полный бот']].map(([v,n])=>`<option value="${v}" ${game.train.dummy===v?'selected':''}>${n}</option>`).join('')}</select><button data-tr="reset">↺ Сброс (T)</button><select id="tw">${wl}</select><button data-tr="spawn">+ Оружие</button><button data-tr="exit">Меню</button>`;
 p.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.tr;if(a==='reset')this.trainReset();if(a==='spawn'){const f=game.fighters[0];game.items.spawn(f.root.x+f.face*120,f.root.y-60,$('#tw').value,{rarity:0,life:60})}if(a==='exit')this.act('tomenu')};

// ---------- actions ----------
UI.act=function(a,v,el){const g=this.game,c=g.cfg;
 switch(a){
 case 'show':this.show(v);break;
 case 'play':if(c.mode==='training'&&false){}g.start(c);S.data.last=JSON.parse(JSON.stringify(c));S.save();break;
 case 'starttrain':c.mode='training';g.start(c);break;
 case 'startfree':c.mode='free';g.start(c);break;
 case 'tab':this.s.tab=v;this.rerender();break;
 case 'wcat':this.s.wcat=+v;this.rerender();break;
 case 'slot':this.s.off=v==='1';this.rerender();break;
 case 'pickchar':{if(v!=='rand'&&!S.isCharUnlocked(v)){this.toast('Персонаж заблокирован — выигрывайте матчи');return}const t=this.s.tab;(t==='bot'?c.bot:c[t]).char=v;if(t==='p1'||t==='p2'){const i=c.fslots.findIndex(s=>s.ctrl===t);if(i>=0)c.fslots[i].char=v}this.rerender();break}
 case 'pickmode':c.mode=v;if(v==='tournament')c.rounds=1;if(v==='versus'||v==='bot')c.rounds=Math.max(c.rounds,2);this.rerender();S.data.last=c;S.save();break;
 case 'pickarena':if(!S.isArenaUnlocked(v)){this.toast('Арена заблокирована — выигрывайте матчи');return}c.arena=v;this.rerender();break;
 case 'pickweapon':{const t=this.s.tab,sl=t==='bot'?c.bot:c[t];const w=SD.WEAPONS[v];if(v!=='none'&&v!=='auto'&&v!=='random'&&(w.slot==='off')!==this.s.off){this.toast(this.s.off?'Выберите щит':'Это оружие для основной руки');return}if(this.s.off)sl.off=v;else sl.weapon=v;this.rerender();break}
 case 'resume':g.pause(false);break;
 case 'restart':g.paused=false;this.hideOverlay();g.restart();break;
 case 'rematch':g.restart();break;
 case 'tomenu':g.paused=false;g.stop();this.show('main');break;
 case 'nextbracket':g.nextBracket();break;
 case 'rebind':{const [p,k]=v.split('.');el.textContent='…';SD.Input.rebind=code=>{SD.Input.rebind=null;if(code!=='Escape'){S.data.settings.keys[p][k]=code;S.save()}this.rerender()};break}
 case 'defkeys':S.data.settings.keys=JSON.parse(JSON.stringify(S.defaultKeys));S.save();this.rerender();break;
 case 'unlockall':S.unlockAll();this.toast('Всё открыто');this.rerender();break;
 case 'resetsave':if(confirm('Сбросить весь прогресс?')){S.reset();this.rerender()}break;
 case 'savecfg':{const n=($('#cfgname').value||'Бой '+(Object.keys(S.data.configs).length+1)).trim();S.data.configs[n]=JSON.parse(JSON.stringify(c));S.save();this.rerender();this.toast('Сохранено: '+n);break}
 case 'loadcfg':{const o=S.data.configs[v];if(o){Object.assign(g.cfg,JSON.parse(JSON.stringify(o)));this.rerender();this.toast('Загружено')}break}
 case 'delcfg':delete S.data.configs[v];S.save();this.rerender();break;
 }};
UI.inp=function(k,el,chg){const g=this.game,c=g.cfg,st=S.data.settings;let v=el.type==='checkbox'?el.checked:el.value;
 if(k==='master'){st.master=+v;SD.Audio.setVol(st.master,st.sfx);S.save();return}
 if(k==='sfx'){st.sfx=+v;SD.Audio.setVol(st.master,st.sfx);S.save();return}
 if(k==='quality'){st.quality=v;S.save();g.setQuality(v);return}
 if(k==='shake'){st.shake=v;S.save();return}
 if(k==='touch'){st.touch=v;S.save();this.setupTouch();return}
 if(k==='import'){const f=el.files[0];if(f)SD.RigImporter.importFile(f,(err,rig,name)=>{if(err){this.toast('Ошибка импорта: '+err.error);return}this.importRig(rig,name)});return}
 if(k.startsWith('cfg.')){const kk=k.slice(4);c[kk]=+v;const lab=el.parentElement.querySelector('b');if(lab)lab.textContent=({hp:v+'%',speed:(+v).toFixed(2)+'×',gravity:(+v).toFixed(2)+'×',knockback:(+v).toFixed(1)+'×'})[kk];return}
 if(k.startsWith('fs.')){const [,i,f]=k.split('.');const s=c.fslots[+i];s[f]=f==='team'?+v:v;if(f==='ctrl'&&(v==='p1'||v==='p2'))c.fslots.forEach((o,j)=>{if(j!==+i&&o.ctrl===v)o.ctrl='bot'});if(chg)this.rerender();return}
 if(['botLevel','rounds','time','teamSize','count'].includes(k)){c[k]=+v;if(k==='count')while(c.fslots.length<c.count)c.fslots.push({char:'rand',weapon:'auto',ctrl:'bot',team:c.fslots.length+1});if(chg)this.rerender();return}
 if(k==='arena'){c.arena=v;return}
 if(k==='dummy'||k==='infHp'||k==='pickups'||k==='destruct'){c[k]=v;return}
};
UI.importRig=function(rig,name){const prof=SD.RigImporter.toProfile(rig,name);
 if(rig.nodeCount>100){ // looks like a weapon rig
  const id='imp_'+name.replace(/\W/g,'_').toLowerCase();SD.WEAPONS[id]=Object.assign({},SD.WEAPONS.sword,{id,name:name+' (импорт)',cat:'Особое',col:prof.color==='#222222'?(prof.accent||'#ff2222'):prof.color,glow:prof.accent||prof.color,dmg:16,len:130,speed:0.85,w:5,sil:id});this.toast('Оружие импортировано: '+name);return}
 const id='imp_'+name.replace(/\W/g,'_').toLowerCase();SD.CHARS[id]={id,name:name+' (импорт)',rig:name,group:'IMP',style:'Импортированный риг: цвет и дополнительные узлы из .nodes.',hp:100,power:1,def:0.03,kbRes:0.1,speed:1,jump:1,stamina:100,scale:1,color:prof.color,acc:prof.extraNodes>=20&&prof.accent?{cape:prof.accent}:{hair:prof.color},ab:JSON.parse(JSON.stringify(SD.CHARS.second.ab))};
 SD.RigImporter.rigs[name+' SF.nodes']=rig;SD.CHAR_ORDER.push(id);S.data.unlockedChars.push(id);this.toast('Персонаж импортирован: '+name);this.rerender()};
// ---------- previews ----------
UI.previewTick=function(dt){
 pg.time+=dt;const cs=this.root.querySelectorAll('canvas[data-pc],canvas[data-pw]');
 cs.forEach(cv=>{const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
  if(cv.dataset.pc){let pf=this.prev.get(cv);if(!pf){const sl=this.s.tab==='bot'?this.game.cfg.bot:this.game.cfg[this.s.tab]||this.game.cfg.p1;pf=new SD.PreviewFighter(pg,cv.dataset.pc,this.s.screen==='chars'&&cv.dataset.big?sl.weapon==='auto'?SD.CHARS[cv.dataset.pc].weapon:sl.weapon:SD.CHARS[cv.dataset.pc].weapon,{});this.prev.set(cv,pf)}
   pf.update(dt,pg);ctx.save();const sc=cv.height/175;ctx.translate(cv.width/2,cv.height*0.92);ctx.scale(sc,sc);pf.draw(ctx,pg);ctx.restore()}
  else{const d=SD.WEAPONS[cv.dataset.pw];ctx.save();const sc=Math.min(1.4,(cv.width-20)/(d.len*1.1),(cv.height-6)/50);ctx.translate(cv.width/2-(0.5-d.pivot)*d.len*sc,cv.height/2);ctx.scale(sc,sc);if(d.slot==='off'||d.style==='bow'){ctx.rotate(0)}else ctx.rotate(0);SD.Weapons.drawShape(ctx,d,pg.time,0,'medium');ctx.restore()}
 })};
// ---------- touch controls ----------
UI.initTouch=function(){
 const T=SD.Input.touch,el=$('#touch');const joy=$('#joy'),knob=$('#knob');let jid=null,jc=null;
 const jr=()=>Math.max(40,Math.min(innerWidth,innerHeight)*0.11);
 const jmove=e=>{if(e.pointerId!==jid)return;const r=jr();let dx=e.clientX-jc[0],dy=e.clientY-jc[1];const l=Math.hypot(dx,dy);if(l>r){dx*=r/l;dy*=r/l}knob.style.transform=`translate(${dx}px,${dy}px)`;T.x=Math.abs(dx)>r*0.3?Math.sign(dx):0;T.y=dy/r;T.jumpHeld=dy<-r*0.55};
 joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(jid);const rc=joy.getBoundingClientRect();jc=[rc.left+rc.width/2,rc.top+rc.height/2];jmove(e);SD.Audio.resume()});
 joy.addEventListener('pointermove',jmove);
 const jend=e=>{if(e.pointerId!==jid)return;jid=null;knob.style.transform='';T.x=0;T.y=0;T.jumpHeld=false};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
 el.querySelectorAll('[data-b]').forEach(b=>{const k=b.dataset.b;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');SD.Audio.resume();
   if(k==='block')T.block=true;else if(k==='light'){T.ev.light=true;T.lightHeld=true}else if(k==='heavy'){T.ev.heavy=true;T.heavyHeld=true}else if(k==='jump'){T.ev.jump=true;T.jumpHeld=true}else if(k==='pause'){UI.game.pause()}else T.ev[k]=true});
  const up=e=>{b.classList.remove('on');if(k==='block')T.block=false;if(k==='light')T.lightHeld=false;if(k==='heavy')T.heavyHeld=false;if(k==='jump')T.jumpHeld=false};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});
 ['gesturestart','dblclick','contextmenu'].forEach(n=>el.addEventListener(n,e=>e.preventDefault()));
};
UI.setupTouch=function(){const st=S.data.settings.touch;const touchy='ontouchstart' in window||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);const on=st==='on'||(st==='auto'&&touchy);SD.Input.touch.active=on;document.body.classList.toggle('touchon',on)};
})(window.SD);

</script><script>
'use strict';
(function(SD){
 SD.Save.load();
 SD.RigImporter.loadEmbedded();
 SD.Input.init();
 const g=new SD.Game(document.getElementById('game'));
 SD.Audio.setVol(SD.Save.data.settings.master,SD.Save.data.settings.sfx);
 const last=SD.Save.data.last;if(last)try{Object.assign(g.cfg,last)}catch(e){}
 SD.UI.init(g);
 window.__sd=g;
 g.arena=new SD.Arena(g.cfg.arena,g,{destruct:false});g.camSnap=true;requestAnimationFrame(t=>g.frame(t));
})(window.SD);
