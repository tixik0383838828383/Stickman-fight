<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Stickman Duel Arena</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="trainPanel" class="hidden"></div>
<div id="touch">
 <div id="joy"><div id="knob"></div></div>
 <button data-b="pause" class="tb pause">❚❚</button>
 <div class="tbtns">
  <button data-b="jump" class="tb">⤒<small>Прыжок</small></button>
  <button data-b="light" class="tb">👊<small>Удар</small></button>
  <button data-b="heavy" class="tb">💥<small>Сильн.</small></button>
  <button data-b="block" class="tb">🛡<small>Блок</small></button>
  <button data-b="ability" class="tb">✨<small>Спец</small></button>
  <button data-b="interact" class="tb">✋<small>Взять</small></button>
  <button data-b="throw" class="tb">🎯<small>Бросок</small></button>
 </div>
</div>
<div id="toast"></div>
<noscript>Требуется JavaScript</noscript>
<script src="js/util.js"></script><script src="js/rigdata.js"></script><script src="js/rig.js"></script>
<script src="js/save.js"></script><script src="js/audio.js"></script><script src="js/physics.js"></script>
<script src="js/data.js"></script><script src="js/arena.js"></script><script src="js/fighter.js"></script>
<script src="js/moves.js"></script><script src="js/weapons.js"></script><script src="js/combat.js"></script>
<script src="js/abilities.js"></script><script src="js/ai.js"></script><script src="js/input.js"></script>
<script src="js/game.js"></script><script src="js/ui.js"></script><script src="js/main.js"></script>
</body></html>
